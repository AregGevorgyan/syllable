<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syllable Counter</title>
  <meta name="description" content="Type or paste text and see syllable counts per line, with every word broken into syllables, in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="data/cmudict.txt" as="fetch" crossorigin>
</head>
<body>
  <main class="workspace">
    <section class="pane">
      <div class="pane-head">
        <span></span>
        <button type="button" id="clear-btn" title="Clear text (undo with ⌘Z / Ctrl+Z)">Clear <kbd id="clear-key">⌘K</kbd></button>
      </div>
      <textarea id="input" spellcheck="true" autocomplete="off"
        placeholder="Start typing or paste a poem, lyrics, or any text…"
        aria-label="Text to count syllables in"></textarea>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="stats" aria-live="polite">
          <span class="stat stat-main"><span class="stat-value" id="total-syllables">0</span> <span class="stat-label">syllables</span></span>
          <span class="stat"><span class="stat-value" id="total-words">0</span> <span class="stat-label">words</span></span>
          <span class="stat"><span class="stat-value" id="total-lines">0</span> <span class="stat-label">lines</span></span>
        </div>
        <span id="status" class="status"></span>
      </div>
      <div id="output" class="output" aria-label="Syllable breakdown"></div>
      <div id="legend" class="legend" aria-label="Vowel sound colors" hidden></div>
    </section>
  </main>

  <script src="js/syllables.js"></script>
  <script src="js/pronouncing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
